# إعداد LiveKit المُوصى به لـ Glottical على VPS 187.124.36.228
# انسخ إلى /opt/livekit/livekit.yaml وعدّل المفاتيح فقط
port: 7880
bind_addresses:
  - "0.0.0.0"
log_level: info

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  # مع Docker host network: ثبّت IP العام ولا تكتشف واجهات docker
  use_external_ip: false
  node_ip: 187.124.36.228
  packet_buffer_size_video: 800
  packet_buffer_size_audio: 300
  congestion_control:
    enabled: true
    allow_pause: false
  interfaces:
    excludes:
      - docker0
      - br-+
      - veth+
  stun_servers:
    - stun.l.google.com:19302
    - live.muallimx.com:3478

room:
  empty_timeout: 300
  departure_timeout: 30
  enable_remote_unmute: true
  max_participants: 50

keys:
  YOUR_API_KEY: YOUR_API_SECRET
