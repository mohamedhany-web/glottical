# إعداد LiveKit المُوصى به لـ Glottical على VPS 187.124.36.228
# انسخ إلى /opt/livekit/livekit.yaml وعدّل المفاتيح فقط
# الدليل الكامل: docs/LIVEKIT-COMPLETE-GUIDE.md
port: 7880
bind_addresses:
  - "0.0.0.0"
log_level: info
prometheus_port: 6789

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  # مع Docker host network: ثبّت IP العام
  use_external_ip: true
  node_ip: 187.124.36.228
  packet_buffer_size_video: 800
  packet_buffer_size_audio: 300
  congestion_control:
    enabled: true
    allow_pause: false
  interfaces:
    includes:
      - eth0
    excludes:
      - docker0
      - br-+
      - veth+
  stun_servers:
    # لا تستخدم 3478 على هذا السيرفر — هو coturn الخاص بـ Jitsi/muallimx
    - stun.l.google.com:19302

# TURN مدمج — ضروري عندما UDP المباشر يتدهور (شبكات مصر/موبايل)
# منافذ بديلة لتجنب تعارض coturn الخاص بـ Jitsi على 3478/5349
turn:
  enabled: true
  domain: live.glottical.com
  cert_file: /etc/livekit/certs/fullchain.pem
  key_file: /etc/livekit/certs/privkey.pem
  udp_port: 34789
  tls_port: 5351
  # false = LiveKit يخدم TLS مباشرة على tls_port
  external_tls: false
  relay_range_start: 30000
  relay_range_end: 40000

room:
  empty_timeout: 300
  departure_timeout: 30
  enable_remote_unmute: true
  # سقف آمن على VPS بـ 2 cores
  max_participants: 60

keys:
  YOUR_API_KEY: YOUR_API_SECRET
